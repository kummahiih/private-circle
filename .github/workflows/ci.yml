name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Pack hygiene (no hashes/ in tarball)
        run: |
          npm pack --dry-run 2>&1 | tee pack-list.txt
          if grep -E '(^|/)hashes(/|$)' pack-list.txt; then
            echo "ERROR: hashes/ must not be packaged"
            exit 1
          fi
          echo "OK: pack does not include hashes/"
